CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=5
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
# Nordic UARTE enables the async API per hardware instance. Without this,
# uart_callback_set(uart0, ...) returns -ENOSYS/-ENOTSUP and initialization
# exits before the first snapshot and heartbeat are scheduled.
CONFIG_UART_0_ASYNC=y
CONFIG_SPECTRUM_DONGLE_UART=y

# Keep the proven polling self-test available, but use live ZMK status normally.
CONFIG_SPECTRUM_DONGLE_UART_SELF_TEST=n

